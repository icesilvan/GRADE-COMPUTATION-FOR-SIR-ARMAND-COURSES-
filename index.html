<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Grade Inquiry</title>
  <style>
    .contact-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 16px 0;
      font-family: Arial, sans-serif;
    }

    .contact-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .contact-icon {
      font-size: 1.25rem;
    }

    .contact-label {
      margin: 0;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
    }

    .contact-email {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .contact-email:hover {
      text-decoration: underline;
    }

    .copy-btn {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <div class="contact-info">
      <span class="contact-icon">✉️</span>
      <div>
        <p class="contact-label">Have questions or grade inquiries?</p>
        <a 
          class="contact-email" 
          href="mailto:armandnicole.bautista@g.batstate-u.edu.ph?subject=Grade%20Inquiry%3A%20%5BInsert%20Student%20Name%2FID%5D&body=Dear%20Instructor%20Bautista%2C%0A%0AI%20am%20reaching%20out%20regarding%20my%20grades%20for%20%5BSubject%20Name%5D.%0A%0AMy%20Details%3A%0A-%20Student%20Name%3A%20%0A-%20Student%20ID%3A%20%0A%0AMy%20Concern%2FQuestion%3A%0A%5BPlease%20describe%20your%20inquiry%20here%5D%0A%0AThank%20you!"
        >
          armandnicole.bautista@g.batstate-u.edu.ph
        </a>
      </div>
    </div>
    <button class="copy-btn" onclick="copyEmail()">Copy Email</button>
  </div>

  <script>
    function copyEmail() {
      const email = "armandnicole.bautista@g.batstate-u.edu.ph";
      navigator.clipboard.writeText(email).then(() => {
        alert("Email address copied to clipboard!");
      }).catch(err => {
        console.error("Failed to copy email: ", err);
      });
    }
  </script>

</body>
</html>
